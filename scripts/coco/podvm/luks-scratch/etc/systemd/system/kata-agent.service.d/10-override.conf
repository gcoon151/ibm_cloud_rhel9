[Unit]
# Ensure kata-agent never starts until luks-scratch has finished formatting
# and opening /dev/mapper/scratch. Without this ordering kata-agent races ahead
# of luks-scratch, writes agent.sock immediately, APF fires, and the Kata shim's
# hardcoded 30 s checkRequestTimeout expires before luks-scratch finishes (~90 s
# on IBM Cloud storage). Delaying kata-agent here means APF (gated on agent.sock
# via agent-protocol-forwarder.path) also waits, so the 30 s clock only starts
# once the VM is actually ready to serve requests.
After=luks-scratch.service
Requires=luks-scratch.service

[Service]
ExecStartPre=sh -c '[ -b /dev/mapper/scratch ] && mount /dev/mapper/scratch /kata-containers'
