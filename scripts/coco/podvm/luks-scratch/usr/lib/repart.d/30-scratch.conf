[Partition]
Type=linux-generic
Label=scratch
# SizeMaxBytes caps the scratch partition at 256 MB so LUKS format + mkfs
# completes in <10 s on IBM Cloud network storage (~30 MB/s).
# Without this cap the partition fills all free disk space (~2.6 GB on a 10 GB
# disk) and format takes ~90 s — longer than the kata shim's 30 s hardcoded
# checkRequestTimeout, killing the VM before kata-agent can start.
SizeMaxBytes=268435456