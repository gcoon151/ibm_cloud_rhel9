[Partition]
Type=linux-generic
Label=scratch
# No SizeMaxBytes: the scratch partition takes all free disk space. Guest-pulled
# images unpack here (/kata-containers is bind-mounted onto /run/kata-containers),
# so a cap limits total pulled image size. The old 256 MB cap (O-1) caused ENOSPC on
# guest pulls. Format time no longer depends on size: format-scratch.sh uses
# pbkdf2-1000 and lazy mkfs (O-3, d2b9d22), and writes ~35 MB whether the partition
# is 256 MB or 10 GB (~1-2 s at IBM Cloud's ~30 MB/s).
